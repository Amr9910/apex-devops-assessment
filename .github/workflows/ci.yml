name: CI

on:
  push:
  pull_request:

jobs:
  test-lint-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run lint
        run: ruff check app.py tests

      - name: Run automated tests
        run: pytest -q

      - name: Build container image
        run: docker build -t apex-operations-api:${{ github.sha }} .

      # Deliberately no deployment step: deployment must not happen unless all
      # preceding checks pass. This assessment uses a local deployment.
