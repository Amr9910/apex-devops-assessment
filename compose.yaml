services:
  api:
    image: apex-operations-api:${IMAGE_TAG:-local}
    build:
      context: .
    environment:
      APP_VERSION: ${IMAGE_TAG:-local}
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-apex}
      DB_USER: ${DB_USER:-apex_user}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your shell or .env file}
    ports:
      - "5001:5000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-apex}
      POSTGRES_USER: ${DB_USER:-apex_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your shell or .env file}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
